; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32c3-ir

[env:esp32c3-ir]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = direct
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
extra_scripts = pre:scripts/pio_env_flags.py
lib_deps =
	crankyoldgit/IRremoteESP8266 @ ^2.8.2
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer
	bblanchon/ArduinoJson@^7.4.3

[env:esp32c3-test]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
test_build_src = yes
build_src_filter = +<ir_utils.cpp> +<hex_utils.cpp> +<IrSender.cpp> -<main.cpp> -<ble_server.cpp>
test_ignore = test_hex_utils_native
lib_deps = bblanchon/ArduinoJson@^7.4.3

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<hex_utils.cpp> +<IrSender.cpp>
test_ignore = hardware
build_flags = -I test/mocks
lib_deps = bblanchon/ArduinoJson@^7.4.3
